[project]
name = "loader"
version = "0.1.0"
description = "基于 LangChain 与 RapidOCR 的多格式文档 OCR 加载器（Word/PPT/PDF/图片），适用于 RAG 文档解析。"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.7",
    "langchain-core>=0.3",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# OCR 引擎二选一：paddle 版推荐 GPU 场景，onnx 版适合纯 CPU
ocr-paddle = ["rapidocr-paddle"]
ocr-onnx = ["rapidocr-onnxruntime"]
